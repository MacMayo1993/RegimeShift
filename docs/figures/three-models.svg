<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Three levels of geometric constraint on a categorical regime change</title>
  <desc id="desc">Model A places two unrelated points anywhere in the simplex. Model B places two unrelated points on the fundamental Fourier curve inside it. Model C places one point on that curve and reaches the second by a cyclic rotation, adding no new continuous parameter.</desc>

  <style>
    .simplex { fill: none; stroke: #8b949e; stroke-width: 2; }
    .curve   { fill: none; stroke: #8b949e; stroke-width: 2; stroke-dasharray: 5 4; }
    .left    { fill: #3b82f6; }
    .right   { fill: #f59e0b; }
    .shift   { fill: none; stroke: #f59e0b; stroke-width: 2.5; }
    .free    { stroke: #3b82f6; stroke-width: 1.6; stroke-dasharray: 3 3; fill: none; }
    .hd      { font: 600 15px system-ui, sans-serif; fill: #8b949e; }
    .lbl     { font: 13px system-ui, sans-serif; fill: #8b949e; }
    .cost    { font: 600 13px system-ui, sans-serif; fill: #8b949e; }
    .pt      { font: 12px system-ui, sans-serif; fill: #8b949e; }
  </style>

  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
  </marker>

  <!-- ================= Model A ================= -->
  <g transform="translate(0,0)">
    <text class="hd" x="130" y="26" text-anchor="middle">A. Full independent</text>
    <polygon class="simplex" points="130,52 40,212 220,212"/>
    <!-- both points roam the whole simplex -->
    <ellipse class="free" cx="130" cy="160" rx="70" ry="42"/>
    <circle class="left"  cx="92"  cy="140" r="6"/>
    <circle class="right" cx="172" cy="182" r="6"/>
    <text class="pt" x="92"  y="130" text-anchor="middle">θL</text>
    <text class="pt" x="172" y="203" text-anchor="middle">θR</text>
    <text class="lbl"  x="130" y="248" text-anchor="middle">two free points in the simplex</text>
    <text class="cost" x="130" y="270" text-anchor="middle">Δd = m − 1</text>
  </g>

  <!-- ================= Model B ================= -->
  <g transform="translate(280,0)">
    <text class="hd" x="130" y="26" text-anchor="middle">B. Independent fundamental</text>
    <polygon class="simplex" points="130,52 40,212 220,212"/>
    <circle class="curve" cx="130" cy="155" r="52"/>
    <circle class="left"  cx="81"  cy="137" r="6"/>
    <circle class="right" cx="170" cy="122" r="6"/>
    <text class="pt" x="72"  y="127" text-anchor="middle">θL</text>
    <text class="pt" x="178" y="112" text-anchor="middle">θR</text>
    <text class="lbl"  x="130" y="248" text-anchor="middle">two free points, but on the</text>
    <text class="lbl"  x="130" y="264" text-anchor="middle">fundamental subspace</text>
    <text class="cost" x="130" y="286" text-anchor="middle">Δd = d_fund  (dimension reduction)</text>
  </g>

  <!-- ================= Model C ================= -->
  <g transform="translate(560,0)">
    <text class="hd" x="130" y="26" text-anchor="middle">C. Shared exact orbit</text>
    <polygon class="simplex" points="130,52 40,212 220,212"/>
    <circle class="curve" cx="130" cy="155" r="52"/>
    <!-- one shared state, reached again by a rotation -->
    <circle class="left"  cx="85"  cy="129" r="6"/>
    <path class="shift" d="M 87.4 125.2 A 52 52 0 0 1 172.6 125.2" marker-end="url(#arrow)"/>
    <circle class="right" cx="175" cy="129" r="6"/>
    <text class="pt" x="76"  y="119" text-anchor="middle">θ</text>
    <text class="pt" x="130" y="92"  text-anchor="middle">g^r</text>
    <text class="lbl"  x="130" y="248" text-anchor="middle">one point, plus a discrete shift</text>
    <text class="lbl"  x="130" y="264" text-anchor="middle">— no second continuous state</text>
    <text class="cost" x="130" y="286" text-anchor="middle">Δd = 0,  pays log(m − 1)</text>
  </g>
</svg>
