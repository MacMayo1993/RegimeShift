<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" role="img" aria-labelledby="t d">
  <title id="t">Detection rate versus sample size, with and without correct cyclic structure</title>
  <desc id="d">All detectors are calibrated to a common five percent false-positive rate. On an exact-orbit change the constrained detectors reach a given detection rate at shorter samples than the full detector. On a higher-mode change outside the fundamental subspace the ordering reverses and the full detector leads at every length.</desc>
  <style>
    .hd    { font: 600 15px system-ui, sans-serif; fill: #8b949e; }
    .sub   { font: 12px system-ui, sans-serif; fill: #8b949e; }
    .tick  { font: 11px system-ui, sans-serif; fill: #8b949e; }
    .lgd   { font: 13px system-ui, sans-serif; fill: #8b949e; }
    .axis  { stroke: #8b949e; stroke-width: 1.5; }
    .grid  { stroke: #8b949e; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.5; }
    .curve { fill: none; stroke-width: 2.5; }
  </style>
  <text class="hd" x="220" y="26" text-anchor="middle">Structure is real</text>
  <text class="sub" x="220" y="44" text-anchor="middle">exact orbit, m = 6</text>
  <line class="axis" x1="70" y1="380" x2="370" y2="380"/>
  <line class="axis" x1="70" y1="60" x2="70" y2="380"/>
  <line class="grid" x1="70" y1="220.0" x2="370" y2="220.0"/>
  <text class="tick" x="62" y="224.0" text-anchor="end">50%</text>
  <text class="tick" x="62" y="64.0" text-anchor="end">100%</text>
  <text class="tick" x="62" y="384.0" text-anchor="end">0%</text>
  <text class="tick" x="70.0" y="400" text-anchor="middle">50</text>
  <text class="tick" x="220.0" y="400" text-anchor="middle">400</text>
  <text class="tick" x="370.0" y="400" text-anchor="middle">3200</text>
  <text class="tick" x="220" y="420" text-anchor="middle">total length n (log scale)</text>
  <polyline class="curve" style="stroke:#ef4444" points="70.0,353.3 120.0,335.2 170.0,333.1 220.0,237.1 270.0,126.1 320.0,65.3 370.0,60.0"/>
  <circle cx="70.0" cy="353.3" r="3.2" fill="#ef4444"/>
  <circle cx="120.0" cy="335.2" r="3.2" fill="#ef4444"/>
  <circle cx="170.0" cy="333.1" r="3.2" fill="#ef4444"/>
  <circle cx="220.0" cy="237.1" r="3.2" fill="#ef4444"/>
  <circle cx="270.0" cy="126.1" r="3.2" fill="#ef4444"/>
  <circle cx="320.0" cy="65.3" r="3.2" fill="#ef4444"/>
  <circle cx="370.0" cy="60.0" r="3.2" fill="#ef4444"/>
  <polyline class="curve" style="stroke:#3b82f6" points="70.0,350.1 120.0,319.2 170.0,286.1 220.0,182.7 270.0,87.7 320.0,61.1 370.0,60.0"/>
  <circle cx="70.0" cy="350.1" r="3.2" fill="#3b82f6"/>
  <circle cx="120.0" cy="319.2" r="3.2" fill="#3b82f6"/>
  <circle cx="170.0" cy="286.1" r="3.2" fill="#3b82f6"/>
  <circle cx="220.0" cy="182.7" r="3.2" fill="#3b82f6"/>
  <circle cx="270.0" cy="87.7" r="3.2" fill="#3b82f6"/>
  <circle cx="320.0" cy="61.1" r="3.2" fill="#3b82f6"/>
  <circle cx="370.0" cy="60.0" r="3.2" fill="#3b82f6"/>
  <polyline class="curve" style="stroke:#10b981" points="70.0,346.9 120.0,309.6 170.0,257.3 220.0,149.6 270.0,70.7 320.0,60.0 370.0,60.0"/>
  <circle cx="70.0" cy="346.9" r="3.2" fill="#10b981"/>
  <circle cx="120.0" cy="309.6" r="3.2" fill="#10b981"/>
  <circle cx="170.0" cy="257.3" r="3.2" fill="#10b981"/>
  <circle cx="220.0" cy="149.6" r="3.2" fill="#10b981"/>
  <circle cx="270.0" cy="70.7" r="3.2" fill="#10b981"/>
  <circle cx="320.0" cy="60.0" r="3.2" fill="#10b981"/>
  <circle cx="370.0" cy="60.0" r="3.2" fill="#10b981"/>
  <text class="hd" x="630" y="26" text-anchor="middle">Structure is wrong</text>
  <text class="sub" x="630" y="44" text-anchor="middle">higher mode, outside the subspace</text>
  <line class="axis" x1="480" y1="380" x2="780" y2="380"/>
