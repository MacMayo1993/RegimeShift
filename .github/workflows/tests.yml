name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  structural:
    name: structural tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[test]"
      - name: Run the fast structural suite
        run: pytest -m "not slow" -q

  statistical:
    name: statistical validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test]"
      - name: Run the seeded Monte Carlo validation
        run: pytest -m slow -q
      - name: Smoke-test the CLI end to end
        run: |
          python -m regimeshift run --grid quick --out results/quick --workers 2 --no-progress
          test -s results/quick/full_results.csv
          test -s results/quick/score_regression_summary.csv
          test -s results/quick/crossover_estimates.csv
          test -s results/quick/crossover_ratio_summary.csv
          python -m regimeshift analyse --results results/quick/full_results.csv --out results/reanalysed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-grid-results
          path: results/
